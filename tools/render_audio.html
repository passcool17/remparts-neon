<!doctype html><meta charset="utf-8"><title>rendu audio</title>
<script type="module">
// Rendu hors ligne de la musique (OfflineAudioContext) pour l'analyse : ?src=/js/audio.js
window.renderScene = async (src, scene, seconds) => {
  const mod = await import(src + '?v=' + Math.random());
  const SR = 44100, len = Math.ceil(SR * seconds);
  const off = new OfflineAudioContext(2, len, SR);
  const RealAC = window.AudioContext; window.AudioContext = function () { return off; }; window.webkitAudioContext = window.AudioContext;
  const m = new mod.Music(); m.setVolume(0.8); m.init(); clearInterval(m.timer); m.timer = null;
  window.AudioContext = RealAC;
  m.mode = 1; m.off = 0; m.gridT0 = 0.05; m.nextStep = 0;
  const STEP = mod.SPB / 4;
  // états du jeu simulés
  const ev = scene.events || []; let ei = 0;
  for (let s = 0; ; s++) {
    const t = m.gridT0 + s * STEP; if (t > seconds) break;
    while (ei < ev.length && ev[ei].t <= t) { const e = ev[ei++]; if (e.fn === 'key') m.setKey(e.v); else if (e.fn === 'int') m.setIntensity && m.setIntensity(e.v); else m[e.fn](e.v); }
    const st = s % 16; if (st === 0) m.cur = m.advanceBar(t);
    if (m.render) m.render(t); // nouvelle version : automation continue
    m.playStep(t, st, m.cur, Math.floor(s / 16)); m.nextStep = s + 1;
  }
  if (m.offlineTick) for (let t = 0; t < seconds; t += 0.05) m.offlineTick(t);
  const buf = await off.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); ws(36, 'data'); out.setUint32(40, n * 4, true);
  let peak = 0;
  for (let i = 0; i < n; i++) { const a = L[i], b = R[i]; peak = Math.max(peak, Math.abs(a), Math.abs(b));
    out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, a)) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, b)) * 32767, true); }
  const u8 = new Uint8Array(out.buffer); let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { peak, b64: btoa(bin) };
};
window.ready = true;
</script>
